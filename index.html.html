<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Financial Analyst Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#FBFAF7;
    --ink:#1E2422;
    --ink-soft:#565F5B;
    --accent:#1F4D45;
    --line:#DEDAD0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);height:100%;font-family:'Inter',sans-serif;color:var(--ink);}
  #app{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:24px;}
  h1{font-family:'Fraunces',serif;font-size:26px;margin:0 0 2px 0;}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px;}
  #thread{flex:1;overflow-y:auto;padding:8px 0;}
  .msg{margin-bottom:18px;max-width:100%;white-space:pre-wrap;line-height:1.55;font-size:15px;}
  .msg.user{text-align:right;color:var(--ink);}
  .msg.bot{border-left:3px solid var(--accent);padding-left:10px;color:var(--ink);}
  .who{font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
  #composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px;}
  #input{flex:1;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:4px;font-family:inherit;}
  #send{background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:4px;font-weight:600;cursor:pointer;}
  #send:disabled{background:#9DAEA9;cursor:default;}
  .empty{color:var(--ink-soft);font-size:14px;padding:20px 0;}
  .err{color:#A23B2E;font-size:13px;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <h1>Financial Analyst Agent</h1>
  <div class="sub">Ask about the company's financial performance and position.</div>
  <div id="thread"></div>
  <div id="composer">
    <input id="input" type="text" placeholder="Ask a question…" />
    <button id="send">Send</button>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://hook.eu1.make.com/iwhrgza6ofag5ua7on4yqqofgisqf4z3";

  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let messages = [];

  function render(loading){
    thread.innerHTML = '';
    if(messages.length === 0){
      thread.innerHTML = '<div class="empty">Ask something like "What is the current ratio for 2025?"</div>';
    }
    messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      div.innerHTML = '<div class="who">' + (m.role === 'user' ? 'You' : 'Agent') + '</div>' + m.text.replace(/</g,'&lt;');
      thread.appendChild(div);
    });
    if(loading){
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = '<div class="who">Agent</div><i>Thinking…</i>';
      thread.appendChild(div);
    }
    thread.scrollTop = thread.scrollHeight;
  }

  async function send(){
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    messages.push({role:'user', text});
    render(true);
    sendBtn.disabled = true;

    try{
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      const reply = data.reply || data.text || JSON.stringify(data);
      messages.push({role:'bot', text: reply});
    }catch(e){
      messages.push({role:'bot', text: "Couldn't reach the agent. (" + e.message + ")"});
    }
    sendBtn.disabled = false;
    render(false);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });

  render(false);
</script>
</body>
</html>
